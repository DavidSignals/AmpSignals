<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Signals - Sim Stomp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #111111;
            --panel-bg: #1e1e1e;
            --accent: #d9381e; /* Rojo técnico */
            --text-main: #e0e0e0;
            --text-dim: #777777;
            --border-color: #333333;
        }

        body { 
            margin: 0; 
            background: var(--bg-main); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN PROFESIONAL --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-brand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-dim);
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .splash-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .splash-subtitle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 40px;
        }

        .engine-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #555;
            min-height: 20px;
            margin-bottom: 20px;
        }

        .init-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 12px 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(217, 56, 30, 0.1) inset;
        }

        .init-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px rgba(217, 56, 30, 0.4);
        }

        /* --- UI PRINCIPAL --- */
        .app-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px; 
        }

        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 30px; 
        }

        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 1px;}
        .accent { color: var(--accent); }

        .amp-chassis { 
            background: var(--panel-bg); 
            border-radius: 4px; 
            border: 1px solid #444; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        .amp-grille {
            background: repeating-linear-gradient(45deg, #111 0, #111 2px, #1a1a1a 2px, #1a1a1a 4px);
            height: 120px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            border-bottom: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model-plate {
            background: #000;
            padding: 5px 20px;
            border: 1px solid #333;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            letter-spacing: 2px;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
        }

        .control-panel { 
            display: flex; 
            justify-content: space-between; 
            padding: 30px; 
            background: linear-gradient(180deg, #2a2a2a 0%, #1e1e1e 100%);
        }

        .section-group { 
            display: flex; 
            gap: 20px; 
            align-items: center; 
            padding: 0 20px;
            border-right: 1px solid #333;
        }
        .section-group:last-child { border-right: none; }

        .knob-wrapper { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .knob { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            background: radial-gradient(circle at center, #444 0%, #222 100%);
            border: 2px solid #111; 
            position: relative; 
            cursor: ns-resize; 
            box-shadow: 0 4px 5px rgba(0,0,0,0.4);
        }
        
        .knob-indicator { 
            position: absolute; 
            top: 4px; 
            left: 50%; 
            width: 2px; 
            height: 12px; 
            background: #fff; 
            transform: translateX(-50%); 
            border-radius: 1px;
        }

        label { 
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem; 
            margin-top: 12px; 
            color: #aaa; 
            letter-spacing: 1px;
        }

        .bottom-strip {
            background: #111;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .dropdown {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .ir-loader {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ir-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
            background: #0a0a0a;
            padding: 8px 15px;
            border: 1px solid #333;
            min-width: 250px;
            text-align: right;
        }

        .btn-small {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-small:hover { background: #555; }

        .footer { text-align: center; font-size: 0.75rem; color: #555; margin-top: 50px; font-family: 'JetBrains Mono', monospace;}
    </style>
</head>

<body>

    <!-- SPLASH SCREEN REDISEÑADO -->
    <div id="splash-screen">
        <div class="splash-brand">DAVID SIGNALS DSP</div>
        <h1 class="splash-title">SIM STOMP</h1>
        <div class="splash-subtitle">NEURAL ARCHETYPE ENGINE</div>
        <div class="engine-status" id="engine-status">SYSTEM STANDBY</div>
        <button id="init-btn" class="init-btn">ENGAGE AUDIO ENGINE</button>
    </div>

    <!-- MAIN UI -->
    <div class="app-container">
        <header class="top-bar">
            <div class="logo">SIM STOMP <span class="accent">SIGNALS</span></div>
            <div>
                <span style="font-family:'JetBrains Mono', monospace; font-size: 0.8rem; color: #666; margin-right: 15px;">CPU: <span id="cpu-load">0%</span></span>
            </div>
        </header>

        <main class="amp-chassis">
            <div class="amp-grille">
                <div class="model-plate">
                    <span id="active-model-display">CLEAN (USA)</span>
                </div>
            </div>

            <div class="control-panel">
                <!-- IN -->
                <div class="section-group">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="gate" data-min="-80" data-max="0" data-value="-60"><div class="knob-indicator"></div></div>
                        <label>GATE</label>
                    </div>
                </div>

                <!-- PRE -->
                <div class="section-group">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="comp" data-min="0" data-max="10" data-value="0"><div class="knob-indicator"></div></div>
                        <label>COMP</label>
                    </div>
                    <div class="knob-wrapper">
                        <div class="knob" data-param="gain" data-min="0" data-max="10" data-value="4"><div class="knob-indicator"></div></div>
                        <label>GAIN</label>
                    </div>
                </div>

                <!-- EQ -->
                <div class="section-group">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="bass" data-min="-10" data-max="10" data-value="0"><div class="knob-indicator"></div></div>
                        <label>BASS</label>
                    </div>
                    <div class="knob-wrapper">
                        <div class="knob" data-param="mid" data-min="-10" data-max="10" data-value="0"><div class="knob-indicator"></div></div>
                        <label>MID</label>
                    </div>
                    <div class="knob-wrapper">
                        <div class="knob" data-param="treble" data-min="-10" data-max="10" data-value="0"><div class="knob-indicator"></div></div>
                        <label>TREBLE</label>
                    </div>
                </div>

                <!-- POWER -->
                <div class="section-group">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="presence" data-min="0" data-max="10" data-value="5"><div class="knob-indicator"></div></div>
                        <label>PRESENCE</label>
                    </div>
                    <div class="knob-wrapper">
                        <div class="knob" data-param="master" data-min="0" data-max="10" data-value="7"><div class="knob-indicator"></div></div>
                        <label>MASTER</label>
                    </div>
                </div>
            </div>

            <div class="bottom-strip">
                <select id="amp-model-select" class="dropdown">
                    <option value="fender_clean">FENDER - CLEAN (USA)</option>
                    <option value="vox_chime">VOX - CHIME (UK)</option>
                    <option value="marshall_drive">MARSHALL - DRIVE (BRIT)</option>
                </select>

                <!-- CARGADOR DE IRs FUNCIONAL -->
                <div class="ir-loader">
                    <div class="ir-display" id="ir-display">NO IR LOADED</div>
                    <label class="btn-small">
                        LOAD IR (WAV)
                        <input type="file" id="ir-upload" accept=".wav" style="display: none;">
                    </label>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>V1.2 | C++ DSP Pipeline Placeholder | 32-bit Float Processing</p>
        </footer>
    </div>

    <script>
        // === MOTOR DE AUDIO ROBUSTO ===
        let audioCtx;
        let convolverNode;
        let driveNode;
        let gainNode;

        const splashScreen = document.getElementById('splash-screen');
        const statusText = document.getElementById('engine-status');
        const irDisplay = document.getElementById('ir-display');

        // Generador de curva de distorsión temporal (Hasta que integres RTNeural/C++)
        function makeDistortionCurve(amount) {
            let k = amount * 10;
            let n_samples = 44100;
            let curve = new Float32Array(n_samples);
            let deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                let x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        document.getElementById('init-btn').addEventListener('click', async () => {
            statusText.innerText = "REQUESTING AUDIO INTERFACE...";
            
            try {
                // 1. Inicializar contexto de audio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                
                // 2. Pedir permisos al micrófono (Interfaz Behringer UMC404HD etc)
                // Se desactivan los procesos nativos del navegador que arruinan la guitarra
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false,
                        latency: 0
                    } 
                });
                
                statusText.innerText = "BUILDING DSP CHAIN...";

                const source = audioCtx.createMediaStreamSource(stream);
                
                // 3. Crear nodos básicos como prototipo
                driveNode = audioCtx.createWaveShaper();
                driveNode.curve = makeDistortionCurve(4); // Ganancia inicial
                driveNode.oversample = '4x';

                convolverNode = audioCtx.createConvolver();
                
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.5; // Master

                // Conectar: Input -> Drive -> Convolver(Cab) -> Master -> Output
                source.connect(driveNode);
                driveNode.connect(convolverNode);
                convolverNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                // Ocultar splash screen de forma limpia
                statusText.innerText = "ENGINE ACTIVE";
                setTimeout(() => {
                    splashScreen.classList.add('hidden');
                }, 500);
                
            } catch (err) {
                console.error("Audio Error:", err);
                statusText.innerText = "ERROR: INTERFACE ACCESS DENIED OR UNAVAILABLE";
                statusText.style.color = "#d9381e";
            }
        });

        // === CARGADOR DE IMPULSOS (IRs) DE LA CARPETA ===
        // Permite cargar los archivos desde la carpeta assets/irs
        document.getElementById('ir-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !audioCtx) return;

            irDisplay.innerText = "LOADING...";

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const audioData = event.target.result;
                    const decodedBuffer = await audioCtx.decodeAudioData(audioData);
                    
                    // Asignar el buffer IR al nodo de convolución
                    convolverNode.buffer = decodedBuffer;
                    
                    // Mostrar nombre del archivo
                    irDisplay.innerText = file.name.toUpperCase();
                } catch (error) {
                    irDisplay.innerText = "ERROR LOADING IR";
                    console.error("Error decodificando IR:", error);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // === UI: ROTACIÓN DE KNOBS ===
        // Rotación funcional y mapeo de parámetros temporal
        document.querySelectorAll('.knob').forEach(knob => {
            // Inicializar rotación visual base
            const updateKnobVisual = (val, min, max) => {
                const rotation = ((val - min) / (max - min)) * 270 - 135;
                knob.style.transform = `rotate(${rotation}deg)`;
            };
            
            const currentVal = parseFloat(knob.getAttribute('data-value'));
            const minVal = parseFloat(knob.getAttribute('data-min'));
            const maxVal = parseFloat(knob.getAttribute('data-max'));
            updateKnobVisual(currentVal, minVal, maxVal);

            // Simulación de interacción
            knob.addEventListener('click', () => {
                let val = parseFloat(knob.getAttribute('data-value'));
                val += (maxVal - minVal) * 0.1; // incrementar 10%
                if(val > maxVal) val = minVal;
                
                knob.setAttribute('data-value', val);
                updateKnobVisual(val, minVal, maxVal);
                
                const param = knob.getAttribute('data-param');
                
                // Mapear al DSP prototipo
                if(audioCtx) {
                    if (param === 'gain') {
                        driveNode.curve = makeDistortionCurve(val);
                    } else if (param === 'master') {
                        gainNode.gain.value = val / 10;
                    }
                }
            });
        });

        // Cambio de modelo
        document.getElementById('amp-model-select').addEventListener('change', (e) => {
            const names = {
                'fender_clean': 'CLEAN (USA)',
                'vox_chime': 'CHIME (UK)',
                'marshall_drive': 'DRIVE (BRIT)'
            };
            document.getElementById('active-model-display').innerText = names[e.target.value];
        });
    </script>
</body>
</html>
