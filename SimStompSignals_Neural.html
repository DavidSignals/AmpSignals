<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim Stomp Signals - Neural Edition</title>
    <!-- CSS original (asumiendo que lo tienes en css/style.css) -->
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Estilos base por si falta el CSS externo al probar este archivo solo */
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: 'Inter', sans-serif; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #2a2a2a; padding: 2rem; border-radius: 8px; text-align: center; border: 1px solid #444; }
        .modal-btn { background: #e74c3c; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; }
        .modal-btn:hover { background: #c0392b; }
        .app-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .amp-head-unit { background: #222; padding: 30px; border-radius: 10px; border: 2px solid #555; margin-bottom: 20px; }
        .control-panel { display: flex; justify-content: space-around; padding: 20px 0; }
        .section-group { display: flex; gap: 15px; align-items: center; }
        .knob-wrapper { display: flex; flex-direction: column; align-items: center; }
        .knob { width: 40px; height: 40px; border-radius: 50%; background: #444; border: 2px solid #666; position: relative; cursor: ns-resize; }
        .knob.big { width: 60px; height: 60px; }
        .knob-indicator { position: absolute; top: 5px; left: 50%; width: 2px; height: 10px; background: white; transform: translateX(-50%); }
        label { font-size: 0.8rem; margin-top: 5px; color: #aaa; }
        .footer { text-align: center; font-size: 0.8rem; color: #666; margin-top: 40px; }
    </style>
</head>

<body>
    <!-- Welcome Screen Modal -->
    <div id="welcome-modal" class="modal-overlay active">
        <div class="modal-content">
            <h1>SIM STOMP SIGNALS</h1>
            <p>High-Fidelity Neural Amp Simulation</p>
            <p class="subtitle">by David Signals</p>
            <div class="instruction-list">
                <p>⚠️ <strong>Audio Context Required</strong></p>
                <p>Click START to initialize the Neural DSP engine.</p>
            </div>
            <button id="start-btn" class="modal-btn">INITIALIZE SYSTEM</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>DSP SETTINGS</h2>
            <div class="setting-row">
                <label>Audio Output Device</label>
                <select id="audio-output-select">
                    <option value="default">System Default</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Buffer Size (Latency)</label>
                <select id="buffer-size-select">
                    <option value="64">64 ms (Ultra Low - High CPU)</option>
                    <option value="128" selected>128 ms (Low)</option>
                    <option value="256">256 ms (Medium)</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Oversampling</label>
                <select id="oversampling-select">
                    <option value="8">8x (Studio Quality)</option>
                    <option value="4" selected>4x (High Quality)</option>
                    <option value="2">2x (Balanced)</option>
                    <option value="1">None (Low CPU)</option>
                </select>
            </div>
            <button id="close-settings-btn" class="modal-btn secondary">CLOSE</button>
        </div>
    </div>

    <div class="app-container">
        <header class="top-bar">
            <div class="logo">SIM STOMP <span class="accent" style="color:#e74c3c;">SIGNALS</span></div>
            <div class="top-controls">
                <button id="settings-btn" class="modal-btn" style="margin-top:0; background:#444;">⚙️ SETTINGS</button>
            </div>
        </header>

        <main class="amp-head-unit skin-fender">
            <!-- Top Grille / Tubes Visual -->
            <div class="amp-grille" style="text-align: center; margin-bottom: 20px;">
                <div class="logo-plate">
                    <h2 style="margin: 0; letter-spacing: 2px;">NEURAL ARCHETYPE</h2>
                    <span id="active-model-display" style="color: #e74c3c;">USA CLEAN</span>
                </div>
            </div>

            <!-- Main Control Panel -->
            <div class="control-panel">
                <!-- Input / Pre Section -->
                <div class="section-group input-section">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="gate" data-min="-80" data-max="0" data-value="-60">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>GATE</label>
                    </div>
                </div>

                <!-- Pre-Amp / Drive Section -->
                <div class="section-group drive-section">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="compressor" data-min="0" data-max="1" data-value="0">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>COMP</label>
                    </div>
                    <div class="knob-wrapper big">
                        <div class="knob" data-param="preGain" data-min="0" data-max="10" data-value="3">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>GAIN</label>
                    </div>
                </div>

                <!-- Tone Stack -->
                <div class="section-group eq-section">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="bass" data-min="-10" data-max="10" data-value="0">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>BASS</label>
                    </div>
                    <div class="knob-wrapper">
                        <div class="knob" data-param="mid" data-min="-10" data-max="10" data-value="0">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>MID</label>
                    </div>
                    <div class="knob-wrapper">
                        <div class="knob" data-param="treble" data-min="-10" data-max="10" data-value="0">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>TREBLE</label>
                    </div>
                </div>

                <!-- Post-Amp / Power Section -->
                <div class="section-group power-section">
                    <div class="knob-wrapper">
                        <div class="knob" data-param="presence" data-min="0" data-max="10" data-value="5">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>PRESENCE</label>
                    </div>
                    <div class="knob-wrapper big">
                        <div class="knob" data-param="master" data-min="0" data-max="10" data-value="5">
                            <div class="knob-indicator"></div>
                        </div>
                        <label>MASTER</label>
                    </div>
                </div>
            </div>

            <!-- Amp Model Selector -->
            <div class="amp-selector-strip" style="text-align: center; margin-top: 30px;">
                <select id="amp-model-select" style="padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; font-size: 1rem;">
                    <option value="fender_clean">FENDER - CLEAN (USA)</option>
                    <option value="vox_chime">VOX - CHIME (UK)</option>
                    <option value="marshall_drive">MARSHALL - DRIVE (BRIT)</option>
                </select>
            </div>

            <!-- Cab / IR Loader -->
            <div class="cab-section" style="text-align: center; margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 6px;">
                <span id="cab-name" style="margin-right: 15px;">Default Cab: 4x12 V30</span>
                <label class="modal-btn" style="background:#555; cursor:pointer; padding: 8px 15px;">
                    LOAD CUSTOM IR
                    <input type="file" id="ir-upload" accept=".wav" style="display: none;">
                </label>
            </div>
        </main>

        <footer class="footer">
            <p>High-Fidelity Guitar Amp Simulator By David Signals • 2026</p>
        </footer>
    </div>

    <!-- SCRIPT MEJORADO CON AUDIO WORKLET INYECTADO -->
    <script>
        // 1. Definimos el AudioWorklet en un Blob para que se pueda descargar como un solo archivo HTML
        const workletCode = `
        class NeuralAmpProcessor extends AudioWorkletProcessor {
            constructor() {
                super();
                // Estado interno del DSP
                this.params = {
                    model: 'fender_clean',
                    preGain: 3.0,
                    bass: 0.0,
                    mid: 0.0,
                    treble: 0.0,
                    presence: 5.0,
                    master: 5.0,
                    oversampling: 4
                };

                // Escuchar cambios desde la UI
                this.port.onmessage = (event) => {
                    if (event.data.type === 'UPDATE_PARAMS') {
                        this.params = { ...this.params, ...event.data.payload };
                    }
                };
            }

            // Aquí se ejecutaría el código WASM (C++)
            process(inputs, outputs, parameters) {
                const input = inputs[0];
                const output = outputs[0];
                
                if (input && input.length > 0) {
                    const channelDataIn = input[0];
                    const channelDataOut = output[0];
                    
                    // Lógica Placeholder: En tu app final, aquí llamas a:
                    // this.wasmModule.processAudioBlock(channelDataIn, channelDataOut, this.params);

                    for (let i = 0; i < channelDataIn.length; i++) {
                        // Bypass directo para el demo (reemplazar con DSP real)
                        channelDataOut[i] = channelDataIn[i]; 
                    }
                }
                return true; // Mantener vivo el procesador
            }
        }
        registerProcessor('neural-amp-processor', NeuralAmpProcessor);
        `;

        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const workletUrl = URL.createObjectURL(blob);

        let audioCtx;
        let ampNode;

        // 2. Inicialización del Sistema Neural
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('welcome-modal').classList.remove('active');
            
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
                await audioCtx.audioWorklet.addModule(workletUrl);
                
                ampNode = new AudioWorkletNode(audioCtx, 'neural-amp-processor');
                
                // Pedir acceso a la guitarra/micrófono sin procesamiento nativo del navegador (crítico para DSP)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false,
                        latency: 0
                    } 
                });
                
                const source = audioCtx.createMediaStreamSource(stream);
                
                // Cadena: Entrada -> Amplificador Neural -> Salida
                source.connect(ampNode);
                ampNode.connect(audioCtx.destination);
                
                console.log("Audio Engine Initialized - WASM Node Ready");
            } catch (err) {
                console.error("Error al iniciar audio:", err);
                alert("Se requiere permiso del micrófono/interfaz para procesar la señal.");
            }
        });

        // 3. Conexión de UI (Knobs) hacia el AudioWorklet
        const updateDSP = (param, value) => {
            if (ampNode) {
                ampNode.port.postMessage({
                    type: 'UPDATE_PARAMS',
                    payload: { [param]: value }
                });
            }
        };

        // Simulación de interacción con knobs (En un caso real usas mousedown/mousemove)
        document.querySelectorAll('.knob').forEach(knob => {
            knob.addEventListener('click', () => {
                const param = knob.getAttribute('data-param');
                const currentValue = parseFloat(knob.getAttribute('data-value'));
                const max = parseFloat(knob.getAttribute('data-max'));
                
                // Rotación cíclica simple para el demo
                let newValue = currentValue + 1;
                if(newValue > max) newValue = parseFloat(knob.getAttribute('data-min'));
                
                knob.setAttribute('data-value', newValue);
                console.log(\`DSP Actualizado -> \${param}: \${newValue}\`);
                
                // Enviar al Worklet
                updateDSP(param, newValue);
                
                // Actualizar rotación visual (css simple inline)
                const rotation = ((newValue - parseFloat(knob.getAttribute('data-min'))) / (max - parseFloat(knob.getAttribute('data-min')))) * 270 - 135;
                knob.style.transform = \`rotate(\${rotation}deg)\`;
            });
        });

        // Selector de Modelos de Amplificador
        document.getElementById('amp-model-select').addEventListener('change', (e) => {
            const model = e.target.value;
            const display = document.getElementById('active-model-display');
            
            if(model === 'fender_clean') display.innerText = 'USA CLEAN';
            if(model === 'vox_chime') display.innerText = 'UK CHIME';
            if(model === 'marshall_drive') display.innerText = 'BRIT DRIVE';
            
            updateDSP('model', model);
        });

        // UI Modals
        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.add('active');
        });
        document.getElementById('close-settings-btn').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.remove('active');
        });
    </script>
</body>
</html>
